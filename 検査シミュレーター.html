<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臨床診断・検査尤度比シミュレーター（文献根拠付き）</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --accent: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background-color: #fff;
    }

    .prob-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-weight: bold;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .badge {
      background-color: #eff6ff;
      color: var(--primary-light);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid #bfdbfe;
    }

    .bayes-result-card {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .bayes-result-card h3 {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .bayes-values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      text-align: center;
    }

    .bayes-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .bayes-box .num {
      font-size: 2rem;
      font-weight: bold;
    }

    .bayes-box .label {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .progress-bar-container {
      background: rgba(255, 255, 255, 0.2);
      height: 10px;
      border-radius: 5px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #4ade80;
      width: 0%;
      transition: width 0.4s ease;
    }

    .test-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
      background-color: #fff;
    }

    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .test-name {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--primary);
    }

    .test-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background-color: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }

    .test-stats div span {
      display: block;
      font-weight: bold;
      color: var(--text);
      font-size: 0.9rem;
    }

    .radio-group {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: normal;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .note-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      background-color: #f8fafc;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
      margin-bottom: 10px;
    }

    /* 論文直リンクスタイル */
    .ref-link-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 8px;
    }

    .ref-link-box a {
      color: #15803d;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .ref-link-box a:hover {
      text-decoration: underline;
    }

    .ref-icon {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🩺 臨床診断・検査尤度比シミュレーター</h1>
    <p>一次文献（JAMA Rational Clinical Examination / Cochrane / PubMed）の感度・特異度・尤度比を用いたリアルタイムベイズ推定ツール</p>
  </header>

  <div class="grid">
    <!-- サイドバー：設定 -->
    <aside>
      <div class="card">
        <h2>疾患選択 & 事前確率</h2>
        
        <div class="form-group">
          <label for="diseaseSelect">対象疾患</label>
          <select id="diseaseSelect">
            <option value="溶連菌性咽頭炎">溶連菌性咽頭炎</option>
            <option value="インフルエンザ">インフルエンザ</option>
            <option value="伝染性単核球症">伝染性単核球症</option>
            <option value="肺炎">肺炎</option>
            <option value="結核">結核</option>
            <option value="マイコプラズマ肺炎">マイコプラズマ肺炎</option>
            <option value="百日咳">百日咳</option>
            <option value="COVID-19">COVID-19</option>
            <option value="流行性耳下腺炎">流行性耳下腺炎</option>
            <option value="アレルギー性鼻炎">アレルギー性鼻炎</option>
            <option value="喘息">喘息</option>
            <option value="副鼻腔炎">副鼻腔炎</option>
            <option value="逆流性食道炎">逆流性食道炎</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priorRange">事前確率 (Pre-test Probability)</label>
          <input type="range" id="priorRange" min="1" max="99" value="20">
          <div class="prob-display">
            <span>設定値:</span>
            <span id="priorVal" style="color: var(--primary-light);">20%</span>
          </div>
        </div>

        <div class="form-group">
          <label>臨床的手がかり（参考）</label>
          <div id="cluesList" class="badge-group"></div>
        </div>
      </div>
    </aside>

    <!-- メインコンテンツ：計算結果 & 検査項目 -->
    <main>
      <!-- ベイズ推定結果カード -->
      <div class="bayes-result-card">
        <h3>事後確率 (Post-test Probability) 算出結果</h3>
        <div class="bayes-values">
          <div class="bayes-box">
            <div class="num" id="dispPrior">20%</div>
            <div class="label">事前確率</div>
          </div>
          <div class="bayes-box">
            <div class="num" id="dispPost">20%</div>
            <div class="label">事後確率</div>
          </div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="postBar"></div>
        </div>
      </div>

      <!-- 疾患概要 -->
      <div class="card">
        <h2 id="diseaseTitle">疾患名</h2>
        <p id="diseaseDesc" style="margin-bottom: 12px; font-size: 0.95rem;"></p>
        <div class="note-box" id="diseaseSummary"></div>
      </div>

      <!-- 検査項目リスト -->
      <div class="card">
        <h2>検査項目と診断特性（一次文献直リンク）</h2>
        <div id="testsContainer"></div>
      </div>
    </main>
  </div>
</div>

<script>
// 全13疾患・文献直リンク（PubMed PMID）完備データベース
const details = {

    clues: ["喉の痛み", "38℃以上の発熱", "白苔・浸出物", "前頸部リンパ節の圧痛"],

  "マイコプラズマ肺炎": {

    tests: [

// DOM要素
const diseaseSelect = document.getElementById("diseaseSelect");
const priorRange = document.getElementById("priorRange");
const priorVal = document.getElementById("priorVal");
const cluesList = document.getElementById("cluesList");

const diseaseTitle = document.getElementById("diseaseTitle");
const diseaseDesc = document.getElementById("diseaseDesc");
const diseaseSummary = document.getElementById("diseaseSummary");
const testsContainer = document.getElementById("testsContainer");

const dispPrior = document.getElementById("dispPrior");
const dispPost = document.getElementById("dispPost");
const postBar = document.getElementById("postBar");

// かぜナビなど、外部ページから ?disease=疾患名 を指定して開いた場合は
// 該当する疾患を最初から選択する。
const requestedDisease = new URLSearchParams(window.location.search).get("disease");
if (requestedDisease && details[requestedDisease]) {
  diseaseSelect.value = requestedDisease;
}

// 初期化・イベント設定
diseaseSelect.addEventListener("change", loadDisease);
priorRange.addEventListener("input", () => {
  priorVal.textContent = `${priorRange.value}%`;
  calculateBayes();
});

function loadDisease() {
  const name = diseaseSelect.value;
  const data = details[name];

  diseaseTitle.textContent = name;
  diseaseDesc.textContent = data.desc;
  diseaseSummary.textContent = data.summary;

  // 手がかりバッジ
  cluesList.innerHTML = data.clues.map(c => `<span class="badge">${c}</span>`).join("");

  // 検査カード生成
  testsContainer.innerHTML = data.tests.map((test, index) => `
    <div class="test-item" data-index="${index}">
      <div class="test-header">
        <div class="test-name">${test.name}</div>
      </div>
      <div class="test-stats">
        <div>感度<span>${test.sens}%</span></div>
        <div>特異度<span>${test.spec}%</span></div>
        <div>陽性尤度比(LR+)<span>${test.lrPos}</span></div>
        <div>陰性尤度比(LR-)<span>${test.lrNeg}</span></div>
      </div>
      <div class="radio-group">
        <label><input type="radio" name="test_${index}" value="none" checked onchange="calculateBayes()"> 未実施</label>
        <label style="color: var(--success); font-weight:600;"><input type="radio" name="test_${index}" value="pos" onchange="calculateBayes()"> 陽性 (+)</label>
        <label style="color: var(--danger); font-weight:600;"><input type="radio" name="test_${index}" value="neg" onchange="calculateBayes()"> 陰性 (-)</label>
      </div>
      <div class="note-box" id="note_${index}">${test.posNote}</div>
      <div class="ref-link-box">
        <span class="ref-icon">📖</span>
        <strong>文献根拠:</strong>
        <a href="${test.refUrl}" target="_blank" rel="noopener noreferrer">
          ${test.refName} ↗
        </a>
      </div>
    </div>
  `).join("");

  calculateBayes();
}

function calculateBayes() {
  const name = diseaseSelect.value;
  const data = details[name];
  
  let priorProb = parseFloat(priorRange.value) / 100;
  if (priorProb >= 1) priorProb = 0.99;
  if (priorProb <= 0) priorProb = 0.01;

  let priorOdds = priorProb / (1 - priorProb);
  let combinedLR = 1.0;

  data.tests.forEach((test, index) => {
    const selected = document.querySelector(`input[name="test_${index}"]:checked`)?.value;
    const noteEl = document.getElementById(`note_${index}`);

    if (selected === "pos") {
      combinedLR *= test.lrPos;
      if (noteEl) noteEl.textContent = `【陽性】 ${test.posNote}`;
    } else if (selected === "neg") {
      combinedLR *= test.lrNeg;
      if (noteEl) noteEl.textContent = `【陰性】 ${test.negNote}`;
    } else {
      if (noteEl) noteEl.textContent = "検査結果を選択すると、臨床的注釈が表示されます。";
    }
  });

  let postOdds = priorOdds * combinedLR;
  let postProb = postOdds / (1 + postOdds);
  let postPercent = Math.round(postProb * 100);

  dispPrior.textContent = `${priorRange.value}%`;
  dispPost.textContent = `${postPercent}%`;
  postBar.style.width = `${postPercent}%`;
}

// 初回ロード
loadDisease();
</script>
